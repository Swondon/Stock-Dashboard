services:
  backend:
    build:
      context: ./backend/StockDashboard.Api
    ports:
      - "5080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5080
    ports:
      - "5173:80"
    depends_on:
      - backend
